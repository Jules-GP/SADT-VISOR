[project]
name = "sadt-cne"
version = "0.1.0"
description = "Extract structured key-value findings from free-text clinical notes with a local quantised LLM."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13).
requires-python = ">=3.11,<3.12"
dependencies = [
    # The inference engine. Pinned to the CPU wheel index below, which is what
    # upstream also installs (CNE/CNE.py:62): these models are 4-8 bit GGUF
    # quantisations that run on a CPU, and the CUDA build would drag a second
    # CUDA runtime into an image whose other tools already carry one. The
    # `device` argument still offers "cuda" -- swapping the index below for
    # `.../whl/cu124` is the whole change a GPU deployment needs.
    "llama-cpp-python==0.3.35",
    # Reading the notes. Neither is heavy and neither is optional in practice,
    # but both are imported only when a note of that format is actually read:
    # a batch of .txt must not fail because a PDF reader is absent.
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
]

# What makes this directory a tool. `name` is the API identity: what a client
# sends, what deployment.toml is keyed by, and what `sup.run()` names.
[tool.sadt]
tool = true
name = "CNE"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_cne"]

# `explicit` is load-bearing: without it uv looks for EVERY package on this
# index, and none of the others are there. It is also what makes this a PINNED
# SOURCE rather than an extra index -- as an extra index uv is free to mix
# registries, and the same version number exists on PyPI as an sdist that
# compiles llama.cpp from source at install time.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
sadt-testkit = { path = "../../testkit", editable = true }
llama-cpp-python = { index = "llama-cpp-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselected by DEFAULT, not merely skipped: a plain `pytest` must not depend on
# a 4.4 GB GGUF being staged, and a suite whose green line is half skips says
# nothing. Run them by hand with `-m models -o addopts=` and report the result.
addopts = "-m 'not gpu and not models'"
markers = [
    "models: needs a real .gguf under DATA/CNE/models/. Skipped by default; run it by hand and report the result in the PR.",
    "gpu: needs a CUDA device AND a CUDA llama-cpp-python build. Skipped in CI (`-m 'not gpu'`).",
]
