[project]
name = "sadt-surgmovpred"
version = "0.1.0"
description = "Predict post-surgical skeletal movements from cephalometric measurements."
# scikit-learn 1.7 supports 3.10 through 3.13. 3.12 is what the port was
# validated on; see README for the 3.10 cross-check.
requires-python = ">=3.12,<3.13"
# Every version here is the one the currently deployed server runs, because
# that is the environment the reference predictions in README were produced in.
# The models are stacking regressors pickled under scikit-learn 1.6.1 and loaded
# under 1.7.2 -- that mismatch is upstream's own design (it silences
# InconsistentVersionWarning), not something to "fix" by moving a pin.
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "joblib==1.5.3",
    # Not optional and easy to miss: the stacking regressors hold LGBMRegressor
    # sub-estimators, so joblib.load fails outright without it.
    "lightgbm==4.7.0",
    # pandas reads .xlsx through openpyxl and .ods through odfpy; neither is
    # pulled in by pandas itself.
    "openpyxl==3.1.5",
    "odfpy==1.4.1",
]

# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- a shared path dependency, the testkit -- is a plain
# package: importable, installable, never discovered or served.
#
# `name` is the API identity: what a client sends, what deployment.toml is keyed
# by, and what another tool passes to `sup.run()`. Declared rather than derived
# from the directory so a folder can be reorganised without breaking the HTTP
# contract -- moving ALI_CBCT under a grouping folder is exactly that case.
[tool.sadt]
tool = true
name = "Surg_Mov_Pred"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_surgmovpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselected by DEFAULT, not merely skipped: a plain `pytest` must not depend
# on 1.4 GB of model packages being staged, and a suite whose green line is
# half skips says nothing. Run them by hand with `-m models -o addopts=` and
# report the result in the PR.
addopts = "-m 'not gpu and not models'"
markers = [
    "gpu: needs a CUDA device. Deselected by default; run it by hand and report the result in the PR.",
    "models: needs the real model packages, named by SADT_SURGMOVPRED_MODELS. Deselected by default. See tests/data/README.md.",
]

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
