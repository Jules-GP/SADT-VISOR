[project]
name = "sadt-areg-ioscbct"
version = "0.1.0"
description = "Register an intraoral scan onto a CBCT of the same patient."
requires-python = ">=3.11,<3.12"
# No torch, no pytorch3d, no nnUNet -- and that is the whole design. This tool
# predicts nothing: the landmarks it registers on are produced by ALI_CBCT and
# ALI_IOS, the tooth labels by Crown_Seg and the orientation by ASO, each in its
# own virtualenv, reached through the supervisor. What is left here is geometry:
# a landmark-based alignment and a point-to-plane ICP.
#
# That is why it can call both an engine pinned to torch 2.8 (AREG_CBCT's side
# of the family) and one pinned to 2.11 (AREG_IOS's) without being pinned to
# either. Containing both stacks would have reintroduced exactly the defect the
# split removed.
dependencies = [
    "sadt-areg-common",
    # >=0.45, not the 0.44.2 upstream carries: 0.44 pins vtk<9.4.0 while the
    # rest of this family is on 9.6.2, and one tool holding the whole repo to an
    # older vtk is the shape the split exists to avoid. 0.45 lifted that bound.
    "pyvista>=0.45",
    "SimpleITK==2.5.6",
    "numpy==2.3.2",
    "scipy==1.16.2",
    "vtk==9.6.2",
]

[tool.sadt]
tool = true
name = "AREG_IOSCBCT"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_areg_ioscbct"]

[tool.uv.sources]
sadt-areg-common = { path = "../common" }
sadt-testkit = { path = "../../../testkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# DESELECTED, not skipped: a skip is a line of output somebody has to read and
# decide about on every run, and neither of these can pass without hardware or
# weights nobody is expected to have. Ask for them by name -- `pytest -m gpu`,
# `pytest -m models` -- which overrides this.
addopts = "-m 'not gpu and not models'"
markers = [
    "gpu: needs a CUDA device. Deselected by default; run it by hand and report the result in the PR.",
    "models: needs the real bundles the supervised tools run with.",
]
