[project]
name = "sadt-areg-common"
version = "0.1.0"
description = "What AREG's engines must not disagree about: the patient key, the catalogs, the scan vocabulary."
requires-python = ">=3.9"
# Deliberately empty, and it must stay that way. This installs into BOTH
# AREG_CBCT's and AREG_IOS's environments, whose whole reason for being separate
# is that their pins are incompatible -- AREG_IOS needs torch 2.11 for pytorch3d
# while AREG_CBCT has no reason to move. A dependency here would have to be
# satisfiable by both at once, which is the constraint the split removed.
# `pairing`, `catalogs`, `scans` and `errors` import `os` and `re`; that is the
# budget.
dependencies = []

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_areg_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
